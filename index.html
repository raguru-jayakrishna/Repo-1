<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A little hello from a bright new page.">
  <title>Hello, all</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f7f8ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 18% 18%, rgb(87 73 230 / 24%), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgb(28 197 187 / 15%), transparent 34%),
        #0b1020;
    }

    .glow {
      position: fixed;
      width: 22rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .2;
      pointer-events: none;
    }

    .glow.one { top: -12rem; right: 12%; background: #8475ff; }
    .glow.two { bottom: -15rem; left: 5%; background: #22d3c5; }

    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 32px;
      background: linear-gradient(145deg, rgb(255 255 255 / 8%), rgb(255 255 255 / 3%));
      box-shadow: 0 32px 100px rgb(0 0 0 / 38%), inset 0 1px rgb(255 255 255 / 8%);
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      color: #b9c1d9;
      font-size: .76rem;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .sparkle { color: #8e83ff; font-size: 1rem; }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7rem);
      font-weight: 760;
      letter-spacing: -.075em;
      line-height: .98;
    }

    h1 span {
      display: block;
      padding: .08em .04em .16em;
      background: linear-gradient(105deg, #fff 12%, #c9c4ff 48%, #7de5da 94%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .message {
      max-width: 31rem;
      margin: 1.6rem auto 0;
      color: #aab3cc;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.75;
    }

    .rule {
      width: 52px;
      height: 3px;
      margin: 2.2rem auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #9185ff, #48d6c9);
    }

    footer {
      position: fixed;
      right: 1.25rem;
      bottom: 1rem;
      left: 1.25rem;
      color: #69738f;
      font-size: .75rem;
      letter-spacing: .04em;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <p class="eyebrow"><span class="sparkle" aria-hidden="true">✦</span> A small beginning</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="message">A little page with a little polish. Here’s to what comes next.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer>Made with curiosity &amp; a touch of color</footer>
</body>
</html>
